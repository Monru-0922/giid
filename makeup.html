<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Good Model – Makeup Final</title>

<script src="face_mesh.js"></script>
<script src="camera_utils.js"></script>

<style>
html,body{
  margin:0;
  background:#000;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

#viewport{
  position:absolute;
  top:50%;
  left:50%;
  width:1080px;
  height:1920px;
  transform:translate(-50%,-50%) scale(var(--scale-factor,1));
}

#video2 {
  position: absolute;
  top: 50px;
  right: 50px;
  width: 320px;
  height: 450px;
  object-fit: cover;
  z-index: 30;
  border: 4px solid #fff;
  transform: scaleX(-1);
}

:root{ --scale-factor:1; }

.stage{
  position:relative;
  width:100%;
  height:100%;
}

video,canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.frame-overlay{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  pointer-events:none;
  z-index:10;
}

.nav{
  position:absolute;
  bottom:300px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:60px;
  z-index:20;
}

.nav img{
  width:130px;
  height:130px;
  object-fit:cover;
  border-radius:50%;
  border:2px solid #fff;
}
#countdown{
  position: absolute;
  top: 170px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 100px;
  font-weight: 300;
  color: #ffffff;
  letter-spacing: 6px;
  text-shadow: 0 0 6px rgba(0,0,0,.7);
  z-index: 60;
  pointer-events: none;
  font-family: -apple-system, sans-serif;
}
</style>
</head>

<body>

<div id="viewport">
<div class="stage">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
  <video id="video2" autoplay muted playsinline></video>

  <img src="image/08.png" class="frame-overlay">
  <div id="countdown">60</div>

 <div class="nav">
  <!-- 加入初始 src，避免標籤空置 -->
  <div onclick="changeStyle(1)"><img src="image/bth2.png"></div> <!-- 第一個預設選中 -->
  <div onclick="changeStyle(2)"><img src="image/bth.png"></div>
  <div onclick="changeStyle(3)"><img src="image/bth.png"></div>
  <div onclick="changeStyle(4)"><img src="image/bth.png"></div>
  <div onclick="changeStyle(5)"><img src="image/bth.png"></div>

</div>
</div>

<script>
  function resize(){
    const s = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
    document.documentElement.style.setProperty("--scale-factor", s);
  }
  resize();
  window.addEventListener("resize", resize);

  const navImgs = document.querySelectorAll(".nav img");
  function updateNavUI(active){
    navImgs.forEach((img,i)=>{
      img.src = (i+1===active) ? "image/bth2.png" : "image/bth.png";
    });
  }

  let currentStyleIndex = 1;
  const makeupSets = {
    1:{face:"makeup/foundation.png",lip:"makeup/lip.png",brow:"makeup/brow.png",eye:"makeup/eye.png",blush:"makeup/blush.png",contact:"makeup/contacts.png"},
    2:{face:"makeup2/foundation.png",lip:"makeup2/lip.png",brow:"makeup2/brow.png",eye:"makeup2/eye.png",blush:"makeup2/blush.png",contact:"makeup2/contacts.png"},
    3:{face:"makeup3/foundation.png",lip:"makeup3/lip.png",brow:"makeup3/brow.png",eye:"makeup3/eye.png",blush:"makeup3/blush.png",contact:"makeup3/contacts.png"},
    4:{face:"makeup4/foundation.png",lip:"makeup4/lip.png",brow:"makeup4/brow.png",eye:"makeup4/eye.png",blush:"makeup4/blush.png",contact:"makeup4/contacts.png"},
    5:{face:"makeup5/foundation.png",lip:"makeup5/lip.png",brow:"makeup5/brow.png",eye:"makeup5/eye.png",blush:"makeup5/blush.png",contact:"makeup5/contacts.png"},
  };

  const makeupCache = {};
  function preloadMakeup(){
    const keys = ["face","lip","brow","eye","blush","contact"];
    for(let i=1;i<=5;i++){
      const set = makeupSets[i];
      const cacheSet = {};
      let loadedCount = 0;
      const need = keys.length + 1;
      keys.forEach(k=>{
        const img = new Image();
        img.onload = ()=>{ loadedCount++; if(loadedCount === need) cacheSet.loaded = true; };
        img.src = set[k];
        cacheSet[k] = img;
      });
      const nose = new Image();
      nose.onload = ()=>{ loadedCount++; if(loadedCount === need) cacheSet.loaded = true; };
      nose.src = "makeup/nose.png";
      cacheSet.nose = nose;
      cacheSet.loaded = false;
      makeupCache[i] = cacheSet;
    }
  }
  preloadMakeup();

  function changeStyle(n){
    if(n < 1) n = 5; if(n > 5) n = 1;
    currentStyleIndex = n;
    updateNavUI(n);
  }

  /* ======================
    鍵盤切換：改為方向鍵右鍵 (ArrowRight)
  ====================== */
  window.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") {
      changeStyle(currentStyleIndex + 1);
    }
  });

  changeStyle(1);

  /* -------------------------------
     FaceMesh & Canvas Setup
  -------------------------------- */
  const video = document.getElementById("video");
  const video2 = document.getElementById("video2");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const faceMesh = new FaceMesh({
  locateFile: (file) => {
    // 假設你將檔案放在與 HTML 同層級的 wasm 資料夾中
    return `./wasm/${file}`;
  }
});

  faceMesh.setOptions({
    maxNumFaces:1,
    refineLandmarks:true,
    minDetectionConfidence:0.6,
    minTrackingConfidence:0.6
  });

  const rawBuffer = document.createElement("canvas");
  const rawCtx = rawBuffer.getContext("2d");
  let fx=0, fy=0, fw=0, lx=0, ly=0, lw=0, initialized=false;

  faceMesh.onResults(res => {
    const w = video.videoWidth; const h = video.videoHeight;
    if(!w || !h) return;
    canvas.width = rawBuffer.width = w;
    canvas.height = rawBuffer.height = h;

    rawCtx.save();
    rawCtx.translate(w,0); rawCtx.scale(-1,1);
    rawCtx.drawImage(video,0,0,w,h);
    rawCtx.restore();

    ctx.clearRect(0,0,w,h);
    ctx.drawImage(rawBuffer,0,0,w,h);

    if(!res.multiFaceLandmarks?.length) return;
    const lm = res.multiFaceLandmarks[0];
    const set = makeupCache[currentStyleIndex] || makeupCache[1];
    if(!set || !set.loaded) return;

    // 妝容計算邏輯 (此處維持原樣)
    const FOUNDATION_SCALE = 4.5;
    const LIP_Y_OFFSET = -0.200;

    const L = (1 - lm[234].x) * w; const R = (1 - lm[454].x) * w;
    const T = lm[10].y * h; const B = lm[152].y * h;
    const cx = (L + R) / 2; const cy = (T + B) / 2;
    const wFace = Math.abs(R - L) * FOUNDATION_SCALE;

    if(!initialized){ fx = cx; fy = cy; fw = wFace; initialized = true; }
    else { fx += (cx - fx) * 0.25; fy += (cy - fy) * 0.25; fw += (wFace - fw) * 0.25; }
    const fh = fw * (set.face.height / set.face.width);
    ctx.drawImage(set.face, fx-fw/2, fy-fh/2+30, fw, fh);

    const lX = (1 - lm[61].x) * w; const rX = (1 - lm[291].x) * w;
    const tY = lm[13].y * h; const bY = lm[14].y * h;
    const cxl = (lX + rX) / 2; const cyl = ((tY + bY) / 2) + (Math.abs(rX-lX) * LIP_Y_OFFSET);
    const targetW = Math.abs(rX - lX) * 16.1;
    if(!lw){ lx = cxl; ly = cyl; lw = targetW; }
    else { lx += (cxl - lx) * 0.25; ly += (cyl - ly) * 0.25; lw += (targetW - lw) * 0.25; }
    const lh = lw * (set.lip.height / set.lip.width);
    ctx.drawImage(set.lip, lx-lw/2, ly-lh/2, lw, lh);

    // 腮紅、眉毛、眼妝、美瞳、鼻影 (略，維持原樣)
    const blushSize = fw * 0.90;
    ctx.globalAlpha = 0.85;
    ctx.drawImage(set.blush,(1-lm[234].x)*w-blushSize/2-60, lm[250].y*h-blushSize/2+8, blushSize, blushSize);
    ctx.drawImage(set.blush,(1-lm[454].x)*w-blushSize/2-44, lm[454].y*h-blushSize/2+35, blushSize, blushSize);
    ctx.globalAlpha = 1;
    const browW = fw * 1.3; const browH = browW * (set.brow.height / set.brow.width) * 0.7;
    ctx.drawImage(set.brow,(1-lm[70].x)*w-browW/2-50, lm[70].y*h-browH/2+55, browW,browH);
    ctx.save(); ctx.translate((1-lm[300].x)*w+50, lm[300].y*h+59); ctx.scale(-1,1); ctx.drawImage(set.brow,-browW/2,-browH/2,browW,browH); ctx.restore();
    const eyeW = fw * 0.21; const eyeH = eyeW * (set.eye.height / set.eye.width);
    ctx.drawImage(set.eye,(1-lm[159].x)*w-eyeW/2+2, lm[159].y*h-eyeH/2+3, eyeW,eyeH);
    ctx.save(); ctx.translate((1-lm[386].x)*w+2, lm[386].y*h+1.5); ctx.scale(-1,1); ctx.drawImage(set.eye,-eyeW/2.1,-eyeH/2.05, eyeW,eyeH); ctx.restore();
    const cw = fw * 0.05; const ch = cw * (set.contact.height / set.contact.width);
    ctx.drawImage(set.contact,(1-lm[468].x)*w-cw/2, lm[468].y*h-ch/1.8, cw,ch);
    ctx.save(); ctx.translate((1-lm[473].x)*w, lm[473].y*h); ctx.scale(-1,1); ctx.drawImage(set.contact,-cw/2,-ch/1.9, cw,ch); ctx.restore();
    const nx = (1-lm[6].x)*w; const ny = lm[6].y*h; const noseH = Math.abs((lm[2].y - lm[168].y) * h); const nw = noseH * 4; const nh = nw * (set.nose.height / set.nose.width);
    ctx.drawImage(set.nose,nx-nw/2.1,ny-nh/2+6,nw,nh);
  });

  /* -------------------------------
     核心修正：雙鏡頭均接外接攝影機
  -------------------------------- */
  async function startCameras() {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videoDevices = devices.filter(d => d.kind === 'videoinput');
      console.log("偵測到攝影機：", videoDevices);

      // 優先尋找名稱中有 "C270" 的設備，若無則抓列表中最後一個 (通常是外接鏡頭)
      let externalCam = videoDevices.find(d => d.label.includes('C270')) || videoDevices[videoDevices.length - 1];

      const stream = await navigator.mediaDevices.getUserMedia({
        video: { 
          deviceId: externalCam ? { exact: externalCam.deviceId } : undefined,
          width: 1080, height: 1920 
        }
      });

      // 同時給予主畫面與右上角小窗
      video.srcObject = stream;
      video2.srcObject = stream;

      video.onloadedmetadata = () => {
        // 使用同一組 video 進行偵測
        const cam = new Camera(video, {
          onFrame: async () => { await faceMesh.send({image: video}); },
          width: 1080, height: 1920
        });
        cam.start();
      };

    } catch (err) {
      console.error("啟動外接攝影機失敗:", err);
    }
  }

  startCameras();

  /* BGM 與 倒數 (略，維持原樣) */
  const bgm = new Audio("makeup_music.mp3");
  bgm.loop = true; bgm.volume = 0.6;
  const savedTime = localStorage.getItem("bgmTime");
  if (savedTime) bgm.currentTime = parseFloat(savedTime);
  window.addEventListener("load", () => { bgm.play().catch(e => console.log(e)); });
  setInterval(() => { if (!bgm.paused) localStorage.setItem("bgmTime", bgm.currentTime); }, 500);

  let timeLeft = 30;
  const cdEl = document.getElementById("countdown");
  const timer = setInterval(async () => {
    timeLeft--; cdEl.textContent = timeLeft;
    if (timeLeft <= 0) {
      clearInterval(timer);
      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = 1080; finalCanvas.height = 1920;
      const fCtx = finalCanvas.getContext('2d');
      fCtx.save(); fCtx.translate(1080, 0); fCtx.scale(-1, 1);
      fCtx.drawImage(video, 0, 0, 1080, 1920); fCtx.restore();
      fCtx.drawImage(canvas, 0, 0, 1080, 1920);
      localStorage.setItem("capturedImage", finalCanvas.toDataURL("image/jpeg", 0.7));
      const frameImg = document.querySelector('.frame-overlay');
      if (frameImg && frameImg.complete) fCtx.drawImage(frameImg, 0, 0, 1080, 1920);
      localStorage.setItem("photo_02", finalCanvas.toDataURL("image/jpeg", 0.9));
      window.location.href = "step5.html";
    }
  }, 1000);
</script>
</body>
</html>
