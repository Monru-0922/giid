<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>列印選擇 - 質感流動邊框版</title>
    <script src="qrcode.min.js"></script>
    <style>

/* ================================================= */
/* 1. 全域佈局與背景 (Body & Global Layout) */
/* ================================================= */
body { 
    background: #000; 
    color: #fff; 
    font-family: sans-serif; 
    text-align: center; 
    margin: 0; 
    padding: 0; 
    overflow: hidden; /* 強制消除捲軸 */
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center; /* 垂直置中 */
    align-items: center;     /* 水平置中 */
}

/* 頁面背景圖 */
.ig-page-bg { 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100vw; 
    height: 100vh; 
    object-fit: cover; 
    z-index: -1; 
    pointer-events: none; 
    opacity: 0.6; 
}

/* 標題與描述 */
h1 { 
    font-size: 3vh; 
    margin-top: 0; 
    margin-bottom: 5px; 
    font-weight: 300; 
    letter-spacing: 2px; 
}

p.desc { 
    font-size: 1.6vh; 
    margin-bottom: 30px; 
    font-weight: 300; 
    letter-spacing: 2px; 
    opacity: 0.8; 
}

/* ================================================= */
/* 2. 照片網格區 (Grid & Photo Items) */
/* ================================================= */
.grid { 
    display: grid; 
    grid-template-columns: repeat(2, 1fr);
    gap: 3vh 40px; 
    width: fit-content; 
    margin: 0 auto;
}

.item {
    background: #111; 
    padding: 12px; 
    border: 1px solid #333; 
    cursor: pointer;
    position: relative; 
    transition: 0.3s;
    height: 30vh;        /* 調整此高度可縮放整體大小 */
    aspect-ratio: 9 / 16; 
    overflow: hidden; 
    display: flex; 
    flex-direction: column;
}

/* ✨ 流動邊框動畫效果 */
.item::before {
    content: ""; 
    position: absolute; 
    top: -50%; 
    left: -50%; 
    width: 200%; 
    height: 200%;
    background: conic-gradient(from 0deg, transparent 0deg, transparent 300deg, #fff 360deg);
    z-index: 1; 
    animation: flowLine 2.5s linear infinite; 
    opacity: 0; 
    transition: opacity 0.3s;
}

.item:hover::before, 
.item.selected::before { 
    opacity: 1; 
}

.item::after { 
    content: ""; 
    position: absolute; 
    inset: 1px; 
    background: #111; 
    z-index: 2; 
}

@keyframes flowLine { 
    from { transform: rotate(0deg); } 
    to { transform: rotate(360deg); } 
}

/* 選中狀態 */
.item.selected {
    border-color: #fff;
    background: #1a1a1a; 
}

/* 內部照片設定 */
.photo { 
    width: 80%;
    height: auto;
    max-height: 80%;
    object-fit: contain; 
    position: absolute; 
    top: 43%;
    left: 50%; 
    transform: translate(-50%, -50%);
    z-index: 3;
    background: #000;
}

/* 外框裝飾 */
.frame-overlay {
    position: absolute;
    top: 0; 
    left: 0;
    width: 100%; 
    height: 100%; 
    background-image: url('image/frame3.png');
    background-size: 100% 100%; 
    pointer-events: none;
    z-index: 4;
}

/* 勾選框 */
.checkbox { 
    position: absolute; 
    top: 15px; 
    right: 15px; 
    width: 20px; 
    height: 20px; 
    border: 1px solid #fff; 
    z-index: 6; 
}

.item.selected .checkbox { 
    background: #fff; 
}

.item.selected .checkbox::after { 
    content: "✓"; 
    color: #000; 
    font-weight: bold; 
    line-height: 20px; 
    display: block; 
    text-align: center; 
    font-size: 14px;
}

/* 項目標籤 */
.item-label { 
    position: absolute; 
    bottom: 30px; 
    width: 100%; 
    left: 0; 
    font-size: 0.6vh; 
    font-weight: 300; 
    z-index: 5; 
    letter-spacing: 2px;
    color:#000
}

/* ================================================= */
/* 3. 底部區域與按鈕 (Bottom Area & Buttons) */
/* ================================================= */
.bottom-area { 
    width: calc(18vh * 2 + 40px); /* 自動計算寬度 = (單張寬 * 2) + 間距 */
    margin-top: 3vh;
    display: flex; 
    justify-content: space-between;
    align-items: stretch;
    gap: 40px; 
}

.btn-section { 
    display: flex; 
    flex-direction: row; 
    gap: 40px; 
    flex: 1;
    width: 100%;
}

#printBtn, #downloadBtn {
    width: 100%; 
    height: 5vh; 
    min-height: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 300;
    font-size: 1.8vh;
    letter-spacing: 2px;
    cursor: pointer; 
    border-radius: 0; 
    transition: 0.3s;
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.8); 
}

#printBtn:hover, #downloadBtn:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: #fff;
}

/* ================================================= */
/* 4. 列印設定 (Print Styles) */
/* ================================================= */
@media print {
    /* 1. 強制瀏覽器渲染色彩與背景圖 */
    * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    
    }

    /* 2. 定義紙張與邊距 (4x6 吋或自動) */
    @page {
        size: 4in 6in; /* 若固定 4x6 可設為 4in 6in */
        margin: 0mm; /* 消除邊距 */
    }

    /* 3. 隱藏不需要的元件 */
 h1, p.desc, .bottom-area, .ig-page-bg, .checkbox {
    display: none !important;
}

    body, html {
        margin: 0 !important;
        padding: 0 !important;
        width: 4in !important;
        height: 6in !important;
        background-color: #000000 !important;
        display: block !important;
        overflow: visible !important;
    }

    .grid {
        display: block !important;
        margin: 0 !important;
        padding: 0 !important;
    }
    .item {
        display: none !important;
    }
    .item.selected {
        display: block !important;
        width: 4in !important;
        height: 6in !important;
        position: fixed !important; /* 改用 fixed 確保鎖定在頁面起始點 */
        top: 0 !important;
        left: 0 !important;
        border: none !important;
        background-color: #000 !important;
        page-break-after: always !important;
        z-index: 9999 !important;
    }

    .frame-overlay {
        display: block !important;
        width: 4in !important;
        height: 6in !important;
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        z-index: 20 !important;
        /* 將圖片路徑直接放入 content，這會讓它被視為普通圖片而非背景 */
        content: url('image/frame3.png') !important; 
        object-fit: fill
    }
    .photo {
        display: block !important;
        /* 您可以調整下方的寬度百分比來控制照片大小 */
        width: 100% !important; 
        height: 100% !important;
        max-height: 80% !important;
        
        /* 絕對置中設定 */
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        transform: none!important;
        
        object-fit: contain !important;
        z-index: 10 !important; /* 照片在相框下面 */
        background-color: #000 !important;
    }
    .item-label { 
     position: absolute; 
     bottom: 30px; 
     width: 100%; 
     left: 0; 
     font-size: 0.6vh; 
     font-weight: 300; 
     z-index: 5; 
     letter-spacing: 2px;
     color:#000
   }
}
</style>
</head>
<body>

<img id="post-bg" class="ig-page-bg" src="image/final-bg.png">
<h1>MODEL1_請選擇照片</h1>
<p class="desc">使用滑鼠選擇列印照片</p>
<div class="grid">
    <div class="item" onclick="toggle(this)" data-id="score">
        <img id="img-score" class="photo" src="image/05.png">
        <div class="frame-overlay"></div>
        <div class="checkbox"></div>
        <div class="item-label">01＿評分結果表</div>
    </div>
    <div class="item" onclick="toggle(this)" data-id="makeup">
        <img id="img-makeup" class="photo" src="image/05.png">
        <div class="frame-overlay"></div>
        <div class="checkbox"></div>
        <div class="item-label">02＿美妝濾鏡</div>
    </div>
    <div class="item" onclick="toggle(this)" data-id="text">
        <img id="img-text" class="photo" src="image/05.png">
        <div class="frame-overlay"></div>
        <div class="checkbox"></div>
        <div class="item-label">03＿文字濾鏡</div>
    </div>
    <div class="item" onclick="toggle(this)" data-id="post">
        <img id="img-post" class="photo" src="image/05.png">
        <div class="frame-overlay"></div>
        <div class="checkbox"></div>
        <div class="item-label">04_社群貼文</div>
    </div>
</div>

<div class="bottom-area">
    <div class="btn-section">
        <button id="printBtn" onclick="doPrint()">
         <span>列印紙本</span> 
        </button>
        <!--
        <button id="downloadBtn" onclick="doDownload()">
            <span>下載數位照片</span> 
        </button>
        -->

    </div>
</div>

<script>
window.onload = () => {
        const photoMapping = {
            'score': 'photo_01', 
            'makeup': 'photo_02', 
            'text': 'photo_03',  
            'post': 'photo_04'   
        };
        Object.keys(photoMapping).forEach(key => {
            const data = localStorage.getItem(photoMapping[key]);
            const imgEl = document.getElementById('img-' + key);
            if (imgEl && data) {
                imgEl.src = data;
            }
        });
    };

    function toggle(el) {
        el.classList.toggle('selected');
    }

    /**
     * 🟢 執行「列印紙本」
     * 功能：僅觸發瀏覽器列印視窗（或靜默列印），完成後跳轉。
     */
    function doPrint() {
        const selectedItems = document.querySelectorAll('.item.selected');
        if (selectedItems.length === 0) {
            alert("請至少選擇一張照片進行列印！");
            return;
        }

        console.log("正在開啟列印預覽...");

        // 1. 觸發瀏覽器列印預覽
        // 程式會在此處暫停，直到使用者關閉預覽視窗
        window.print(); 

        // 2. 自動跳轉邏輯
        // 當使用者按下「列印」或「取消」關閉預覽後，以下程式碼會立即執行
        localStorage.setItem("need_print", "false"); 
        
        // 建議給予極短的延遲（200ms），確保瀏覽器已從列印狀態中完全恢復再跳轉
        setTimeout(() => {
            window.location.href = "ending.html"; 
        }, 200); 
    }
    

    /**
     * 🔵 執行「下載照片」
     * 功能：僅將照片 Base64 資料傳送至 Java 伺服器存檔，不執行列印，完成後跳轉。
     */
    async function doDownload() {
        const selectedItems = document.querySelectorAll('.item.selected');
        if (selectedItems.length === 0) {
            alert("請至少選擇一張照片！");
            return;
        }

        const now = new Date();
        const userId = `${now.getHours()}${now.getMinutes()}${now.getSeconds()}`; 
        localStorage.setItem("current_user_id", userId);

        // 使用 Promise.all 併行處理上傳，速度會比 for 迴圈更快且穩定
        const uploadPromises = Array.from(selectedItems).map(async (item) => {
            const imgEl = item.querySelector('.photo');
            try {
                // 注意：若你的 Java 伺服器路徑 /print 內建了自動列印邏輯，
                // 請聯繫後端開發者提供另一個僅供「存檔」的 API 路徑（例如 /save）。
                const javaServer = `http://localhost:8080/print?id=${userId}`;
                await fetch(javaServer, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: imgEl.src 
                });
                console.log(`✅ ${item.getAttribute('data-id')} 上傳成功`);
            } catch (err) {
                console.error("❌ 無法連線至 Java 伺服器", err);
            }
        });

        // 等待所有照片處理完畢（不論成功或失敗）
        await Promise.all(uploadPromises);

        // 確保列印標記為 false，並執行跳轉
        localStorage.setItem("need_print", "false");
        window.location.href = "ending.html"; 
    }
</script>

</body>
</html>
