<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODEL1 個人照片領取</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        
        /* 照片網格：維持原本的一排兩張 */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            max-width: 500px; 
            margin: 20px auto; 
        }
        
        .item { 
            background: #111; 
            padding: 8px; 
            border: 1px solid #333; 
            display: flex; 
            flex-direction: column; 
        }
        
        .photo { 
            width: 100%; 
            aspect-ratio: 9/16; 
            object-fit: cover; 
            background: #000;
        }

        .save-btn {
            display: block;
            background: #444;
            color: #fff;
            text-decoration: none;
            font-size: 12px;
            padding: 8px 0;
            margin-top: 8px;
            border-radius: 4px;
        }


        h2 { font-weight: 300; letter-spacing: 2px; margin-bottom: 5px; }
        .timer-warning { font-size: 12px; color: #ff5555; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h2>MODEL1_個人照片領取</h2>
    <div class="timer-warning">
     ⚠️ 隱私保護：照片將於 5 分鐘後自動刪除，請立即儲存
    </div>

    <!-- 照片顯示區域 -->
    <div class="grid" id="downloadGrid">
        <p style="grid-column: span 2;">正在讀取您的專屬照片...</p>
    </div>

    <p style="font-size: 13px; color: #aaa;">— 長按圖片或點擊按鈕儲存照片 —</p>



<script>
window.onload = async () => {
    // 1. 從網址抓取專屬 ID (例如 ?id=142030)
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('id');
    
    const currentIP = window.location.hostname;
    const javaServer = `http://${currentIP}:8080`; 
    const grid = document.getElementById('downloadGrid');

    if (!userId) {
        grid.innerHTML = "<p style='grid-column: span 2; padding:40px;'>⚠️ 網址無效，請重新掃描 QR Code</p>";
        return;
    }

    try {
        // 2. 抓取 Java 伺服器上的所有照片清單
        const response = await fetch(`${javaServer}/list`);
        if (!response.ok) throw new Error();
        
        const data = await response.text();
        const allFiles = data.split(',').filter(n => n.trim());

        // 3. ✨ 關鍵過濾：只顯示檔名包含 userId 的照片
        // 假設你的四張照片檔名分別為 score_142030.png, makeup_142030.png ...
        const myFiles = allFiles.filter(name => name.includes(userId));

        grid.innerHTML = ""; 

        if (myFiles.length === 0) {
            grid.innerHTML = "<p style='grid-column: span 2; padding:20px;'>❌ 找不到您的照片<br>可能已過期或 ID 錯誤</p>";
            return;
        }

        // 4. 生成照片網格
        myFiles.forEach(name => {
            const div = document.createElement('div');
            div.className = 'item';
            const imgUrl = `${javaServer}/downloads/${name}`;
            
            div.innerHTML = `
                <img src="${imgUrl}" class="photo" alt="您的照片">
                <a href="${imgUrl}" download="${name}" class="save-btn">📥 儲存照片</a>
            `;
            grid.appendChild(div);
        });

    } catch (err) {
        grid.innerHTML = "<p style='grid-column: span 2; color:#ff5555;'>❌ 伺服器連線失敗</p>";
    }
};
</script>
</body>
</html>
